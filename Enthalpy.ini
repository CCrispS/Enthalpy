; Enthalpy - formation order plugin
; Place this file next to Enthalpy.dll (or put the same section into the game's own ini).
; The game's ini is only used when it already has an [Enthalpy] section; this file wins.
[Enthalpy]
; Reuse the previous selection when both buttons are pressed with nothing selected.
FormationSelectSaved=no
; Draw the coloured cell footprint under each ghost.
TargetBlock=no
; 0 = invisible, 4 = fully opaque.
GhostOpacity=2
; Keep the renderer's drop shadow in the silhouette.
GhostShadow=yes
GhostColorValid=0,251,0
GhostColorInvalid=255,0,0
GhostColorEdge=0,251,0
; yes = write Enthalpy.log (game folder, or %LOCALAPPDATA%\Enthalpy if the folder is read-only).
Enthalpydebug=no
